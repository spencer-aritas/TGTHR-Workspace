services:
  docgen:
    build:
      context: ../tgthr-docgen
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      - SF_ENV=sandbox
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/app
      - GOTENBERG_URL=http://gotenberg:3000
      - HTTP_PROXY=
      - HTTPS_PROXY=
      - ALL_PROXY=
      - NO_PROXY=localhost,127.0.0.1,::1,.salesforce.com,.force.com,.lightning.force.com,docgen,gotenberg
    ports:
      - "127.0.0.1:8003:8000"
    depends_on:
      gotenberg:
        condition: service_healthy
    volumes:
      - type: bind
        source: ./jwt_private.key
        target: /app/jwt_private.key
        read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=268435456,mode=1777
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - docgen_sandbox
      - egress
    restart: "no"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    logging:
      options:
        max-size: "5m"
        max-file: "2"

  gotenberg:
    image: gotenberg/gotenberg:8
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=536870912,mode=1777
    security_opt:
      - no-new-privileges:true
    networks:
      - docgen_sandbox
    restart: "no"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 6

networks:
  docgen_sandbox:
    internal: true
  egress:
    driver: bridge
