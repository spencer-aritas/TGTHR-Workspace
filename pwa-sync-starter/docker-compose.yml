
services:
  caddy:
    image: caddy:2-alpine
    env_file:
      - ./server/.env
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
      - web

  api:
    build: ./server
    env_file:
      - ./server/.env
    environment:
      - TZ=America/Denver
      - SF_ENV=benefits
      - SF_BENEFITS_JWT_LOGIN_URL=https://tgthrnpc--benefits.sandbox.lightning.force.com/
      - APP_BASE_URL=https://localhost
      - SF_JWT_PRIVATE_KEY=${SF_JWT_PRIVATE_KEY:-}
      - DB_PATH=/app/data/app.duckdb
      - SQLITE_DB_PATH=/app/data/server.db
      - PYTHONPATH=/app
      - DEBUG_SETTINGS=1
      - HTTP_PROXY=
      - HTTPS_PROXY=
      - ALL_PROXY=
      - NO_PROXY=localhost,127.0.0.1,::1,.salesforce.com,.force.com,.lightning.force.com,api,docgen,gotenberg
    ports:
      - "8001:8000"
    volumes:
      # Data directory for the app
      - ./server/data:/app/data:Z
    restart: unless-stopped
      
  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    environment:
      - VITE_API_BASE=/api
      - VITE_HOST=0.0.0.0
      - VITE_PORT=5173
      - VITE_ALLOWED_HOSTS=outreachintake.aritasconsulting.com,localhost,0.0.0.0
      - NODE_ENV=development
    ports:
      - "5173:5173"
    volumes:
      - ./web:/usr/src/app
      - ./shared:/usr/src/shared
      - /usr/src/app/node_modules
    depends_on:
      - api

  docgen:
    build: ../tgthr-docgen
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/app
      - SF_ENV=sandbox
      - GOTENBERG_URL=http://gotenberg:3000
      - HTTP_PROXY=
      - HTTPS_PROXY=
      - ALL_PROXY=
      - NO_PROXY=localhost,127.0.0.1,::1,.salesforce.com,.force.com,.lightning.force.com,api,docgen,gotenberg
    ports:
      - "8002:8000"
    volumes:
      - ../tgthr-docgen:/app:ro
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=268435456,mode=1777
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    command: uvicorn serve:app --host 0.0.0.0 --port 8000 --no-access-log
    networks:
      - default
      - internal

  gotenberg:
    image: gotenberg/gotenberg:8
    restart: unless-stopped
    networks:
      - internal

volumes:
  caddy_data:
  caddy_config:

networks:
  default:
  internal:
