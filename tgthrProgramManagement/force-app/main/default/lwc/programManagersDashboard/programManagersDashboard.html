<template>
  <lightning-card class="pm-dashboard">
    <div slot="title" class="slds-grid slds-grid_vertical-align-center">
      <lightning-icon icon-name="standard:dashboard" size="small" class="slds-var-m-right_small"></lightning-icon>
      <span class="slds-text-heading_medium">Program Managers Dashboard</span>
    </div>

    <!-- ─── Filter bar ─── -->
    <div class="slds-var-p-around_medium slds-border_top slds-border_bottom pm-filter-bar">
      <!-- Programs multi-select pills -->
      <div class="pm-filter-section slds-var-m-bottom_small">
        <span class="pm-filter-label">Programs</span>
        <div class="slds-grid slds-gutters_x-small slds-wrap">
          <template for:each={programPills} for:item="pill">
            <div key={pill.id} class="slds-col slds-no-flex">
              <button
                data-id={pill.id}
                class={pill.cssClass}
                onclick={handleProgramPillToggle}
              >
                <lightning-icon
                  icon-name="standard:home"
                  size="x-small"
                  alternative-text="Program"
                  class="slds-var-m-right_xx-small"
                ></lightning-icon>
                {pill.name}
              </button>
            </div>
          </template>
        </div>
      </div>
      <!-- Date / User / Type filters -->
      <div class="slds-grid slds-gutters_small slds-wrap slds-grid_vertical-align-end">
        <div class="slds-col slds-size_1-of-2 slds-medium-size_2-of-12">
          <lightning-input
            type="date"
            label="Start Date"
            value={filters.startDate}
            onchange={handleStartDateChange}
          ></lightning-input>
        </div>
        <div class="slds-col slds-size_1-of-2 slds-medium-size_2-of-12">
          <lightning-input
            type="date"
            label="End Date"
            value={filters.endDate}
            onchange={handleEndDateChange}
          ></lightning-input>
        </div>
        <div class="slds-col slds-size_1-of-1 slds-medium-size_3-of-12">
          <lightning-combobox
            label="User"
            placeholder="All users"
            value={filters.userId}
            options={userOptions}
            onchange={handleUserChange}
          ></lightning-combobox>
        </div>
        <div class="slds-col slds-size_1-of-1 slds-medium-size_3-of-12">
          <lightning-checkbox-group
            label="Type"
            options={typeOptions}
            value={filters.types}
            variant="label-stacked"
            onchange={handleTypeChange}
          ></lightning-checkbox-group>
        </div>
        <div class="slds-col slds-size_1-of-1 slds-medium-size_2-of-12 slds-text-align_right">
          <lightning-button
            label="Clear"
            icon-name="utility:clear"
            onclick={handleClearFilters}
            variant="neutral"
            class="slds-var-m-right_x-small"
          ></lightning-button>
          <lightning-button
            label="Refresh"
            icon-name="utility:refresh"
            onclick={handleRefresh}
            variant="brand"
          ></lightning-button>
        </div>
      </div>

      <!-- Date presets -->
      <div class="slds-var-m-top_small slds-grid slds-gutters_xx-small slds-wrap">
        <template for:each={datePresets} for:item="preset">
          <div key={preset.key} class="slds-col slds-no-flex">
            <button
              data-key={preset.key}
              class={preset.cssClass}
              onclick={handlePresetClick}
            >
              {preset.label}
            </button>
          </div>
        </template>
      </div>

      <!-- Active filter summary -->
      <template if:true={hasActiveFilters}>
        <div class="slds-var-m-top_small slds-text-body_small slds-text-color_weak">
          <lightning-icon icon-name="utility:filter" size="xx-small" class="slds-var-m-right_xx-small"></lightning-icon>
          {filterSummary}
        </div>
      </template>
    </div>

    <!-- ─── Counts strip ─── -->
    <template if:true={hasData}>
      <div class="slds-var-p-around_small slds-grid slds-gutters_small slds-grid_align-spread pm-counts">
        <div>
          <strong>{totalRecords}</strong> record<template if:false={isSingleRecord}>s</template>
          &nbsp;·&nbsp;
          <span class="pm-count-chip pm-chip-interaction">{counts.Interaction} Interactions</span>
          <span class="pm-count-chip pm-chip-documentation">{counts.Documentation} Documentation</span>
          <span class="pm-count-chip pm-chip-incident">{counts.Incident} Incidents</span>
        </div>
        <div>
          Page {pageNumber} of {totalPages}
        </div>
      </div>
    </template>

    <!-- ─── Activity rows ─── -->
    <div class="slds-var-p-horizontal_small">
      <template if:true={loading}>
        <div class="slds-var-p-around_large slds-align_absolute-center">
          <lightning-spinner alternative-text="Loading" size="medium"></lightning-spinner>
        </div>
      </template>

      <template if:false={loading}>
        <template if:true={hasData}>
          <div class="pm-table" role="table">
            <div class="pm-row pm-row-header" role="row">
              <span class="pm-cell pm-cell-date">Date</span>
              <span class="pm-cell pm-cell-type">Type</span>
              <span class="pm-cell pm-cell-subject">Subject</span>
              <span class="pm-cell pm-cell-purpose">Purpose</span>
              <span class="pm-cell pm-cell-participant">Participant</span>
              <span class="pm-cell pm-cell-owner">Owner</span>
              <span class="pm-cell pm-cell-status">Status</span>
              <span class="pm-cell pm-cell-preview">Preview</span>
              <span class="pm-cell pm-cell-actions" aria-hidden="true"></span>
            </div>
            <template for:each={displayRows} for:item="row">
              <div
                key={row.recordId}
                class={row.rowClass}
                role="row"
                data-id={row.recordId}
                onclick={handleRowClick}
              >
                <template if:true={row.isGroupHeader}>
                  <span class="pm-group-label">{row.programName}</span>
                  <span class="pm-group-count">{row.rowCount} records</span>
                </template>
                <template if:false={row.isGroupHeader}>
                  <span class="pm-cell pm-cell-date">{row.dateDisplay}</span>
                  <span class="pm-cell pm-cell-type">
                    <span class={row.chipClass}>{row.category}</span>
                  </span>
                  <span class="pm-cell pm-cell-subject">{row.subject}</span>
                  <span class="pm-cell pm-cell-purpose">{row.purposeText}</span>
                  <span class="pm-cell pm-cell-participant">{row.participant}</span>
                  <span class="pm-cell pm-cell-owner">{row.owner}</span>
                  <span class="pm-cell pm-cell-status">{row.statusText}</span>
                  <span class="pm-cell pm-cell-preview">{row.previewText}</span>
                  <span class="pm-cell pm-cell-actions">
                    <lightning-button-icon
                      icon-name="utility:new_window"
                      alternative-text="Open in new tab"
                      title="Open in new tab"
                      variant="bare"
                      size="small"
                      data-id={row.recordId}
                      onclick={handleOpenInNewTab}
                    ></lightning-button-icon>
                  </span>
                </template>
              </div>
            </template>
          </div>
        </template>
        <template if:false={hasData}>
          <div class="slds-var-p-around_large slds-text-align_center slds-text-color_weak">
            <lightning-icon icon-name="utility:search" size="small" class="slds-var-m-bottom_x-small"></lightning-icon>
            <div>No records match the current filters.</div>
          </div>
        </template>
      </template>
    </div>

    <!-- ─── Pagination footer ─── -->
    <template if:true={hasData}>
      <div class="slds-var-p-around_small slds-grid slds-grid_align-spread slds-grid_vertical-align-center pm-pager">
        <div>
          <lightning-combobox
            label="Page size"
            variant="label-hidden"
            value={pageSizeStr}
            options={pageSizeOptions}
            onchange={handlePageSizeChange}
            class="pm-page-size"
          ></lightning-combobox>
        </div>
        <div class="slds-grid slds-gutters_x-small">
          <lightning-button
            label="First"
            icon-name="utility:jump_to_left"
            disabled={isFirstPage}
            onclick={handleFirstPage}
          ></lightning-button>
          <lightning-button
            label="Prev"
            icon-name="utility:chevronleft"
            disabled={isFirstPage}
            onclick={handlePrevPage}
          ></lightning-button>
          <span class="slds-var-p-horizontal_small slds-align-middle">
            {pageNumber} / {totalPages}
          </span>
          <lightning-button
            label="Next"
            icon-name="utility:chevronright"
            icon-position="right"
            disabled={isLastPage}
            onclick={handleNextPage}
          ></lightning-button>
          <lightning-button
            label="Last"
            icon-name="utility:jump_to_right"
            icon-position="right"
            disabled={isLastPage}
            onclick={handleLastPage}
          ></lightning-button>
        </div>
      </div>
    </template>
  </lightning-card>

  <!-- ─── Activity Detail Modal ─── -->
  <template if:true={showDetailModal}>
    <section
      role="dialog"
      tabindex="-1"
      aria-modal="true"
      aria-labelledby="pm-detail-modal-heading"
      class="slds-modal slds-fade-in-open slds-modal_large"
    >
      <div class="slds-modal__container">
        <!-- Header -->
        <header class="slds-modal__header">
          <lightning-button-icon
            class="slds-modal__close"
            icon-name="utility:close"
            alternative-text="Close"
            variant="bare-inverse"
            onclick={handleCloseModal}
          ></lightning-button-icon>
          <h2 id="pm-detail-modal-heading" class="slds-text-heading_medium slds-truncate">
            {modalRow.subject}
          </h2>
          <div class="slds-modal__header-description pm-modal-meta">
            <span class={modalChipClass}>{modalRow.category}</span>
            <template if:true={modalRow.statusText}>
              <span class="pm-modal-status">{modalRow.statusText}</span>
            </template>
            <template if:true={modalRow.participant}>
              <span class="pm-modal-meta-sep">·</span>
              <span>{modalRow.participant}</span>
            </template>
            <template if:true={modalRow.owner}>
              <span class="pm-modal-meta-sep">·</span>
              <span class="slds-text-color_weak">{modalRow.owner}</span>
            </template>
            <template if:true={modalRow.dateDisplay}>
              <span class="pm-modal-meta-sep">·</span>
              <span class="slds-text-color_weak">{modalRow.dateDisplay}</span>
            </template>
          </div>
        </header>

        <!-- Tabs -->
        <div class="slds-modal__content pm-modal-body">
          <div class="slds-tabs_default">
            <ul class="slds-tabs_default__nav" role="tablist">
              <li
                class={detailTabClass}
                title="Details"
                role="presentation"
              >
                <a
                  class="slds-tabs_default__link"
                  role="tab"
                  data-tab="details"
                  onclick={handleModalTabClick}
                >
                  <lightning-icon icon-name="utility:list" size="x-small" class="slds-var-m-right_xx-small"></lightning-icon>
                  Details
                </a>
              </li>
              <template if:true={modalHasDocumentTab}>
                <li
                  class={documentTabClass}
                  title="Document"
                  role="presentation"
                >
                  <a
                    class="slds-tabs_default__link"
                    role="tab"
                    data-tab="document"
                    onclick={handleModalTabClick}
                  >
                    <lightning-icon icon-name="utility:file" size="x-small" class="slds-var-m-right_xx-small"></lightning-icon>
                    Document
                  </a>
                </li>
              </template>
            </ul>

            <!-- Details Tab Content -->
            <template if:true={isModalDetailTab}>
              <div class="slds-tabs_default__content slds-show pm-modal-tab-panel">
                <template if:true={modalIsIncident}>
                  <div class="pm-incident-detail slds-grid slds-wrap slds-gutters_small slds-var-p-around_medium">
                    <div class="slds-col slds-size_1-of-2 slds-medium-size_1-of-3">
                      <span class="slds-text-title_caps slds-text-color_weak">Type</span>
                      <p class="slds-text-body_regular">{modalRow.purposeText}</p>
                    </div>
                    <div class="slds-col slds-size_1-of-2 slds-medium-size_1-of-3">
                      <span class="slds-text-title_caps slds-text-color_weak">Status</span>
                      <p class="slds-text-body_regular">{modalRow.statusText}</p>
                    </div>
                    <div class="slds-col slds-size_1-of-2 slds-medium-size_1-of-3">
                      <span class="slds-text-title_caps slds-text-color_weak">Date</span>
                      <p class="slds-text-body_regular">{modalRow.dateDisplay}</p>
                    </div>
                    <div class="slds-col slds-size_1-of-2 slds-medium-size_1-of-3">
                      <span class="slds-text-title_caps slds-text-color_weak">Participant</span>
                      <p class="slds-text-body_regular">{modalRow.participant}</p>
                    </div>
                    <div class="slds-col slds-size_1-of-2 slds-medium-size_1-of-3">
                      <span class="slds-text-title_caps slds-text-color_weak">Owner</span>
                      <p class="slds-text-body_regular">{modalRow.owner}</p>
                    </div>
                    <template if:true={modalRow.previewText}>
                      <div class="slds-col slds-size_1-of-1">
                        <span class="slds-text-title_caps slds-text-color_weak">Description</span>
                        <p class="slds-text-body_regular">{modalRow.previewText}</p>
                      </div>
                    </template>
                  </div>
                </template>
                <template if:false={modalIsIncident}>
                  <c-note-detail-display
                    record-id={modalRow.recordId}
                    record-type={modalNoteRecordType}
                    completed-view={modalCompletedView}
                  ></c-note-detail-display>
                </template>
              </div>
            </template>

            <!-- Document Tab Content — inline PDF preview via ContentVersion renditionDownload -->
            <template if:true={isModalDocumentTab}>
              <div class="slds-tabs_default__content slds-show pm-modal-tab-panel pm-modal-pdf-panel">
                <!-- Toolbar -->
                <div class="pm-pdf-toolbar">
                  <lightning-button
                    label="Download PDF"
                    icon-name="utility:download"
                    variant="neutral"
                    onclick={handleDownloadPdf}
                  ></lightning-button>
                </div>
                <!-- Loading state while fetching version ID -->
                <template if:true={modalPdfLoading}>
                  <div class="slds-align_absolute-center slds-var-p-around_large">
                    <lightning-spinner alternative-text="Loading document" size="medium"></lightning-spinner>
                  </div>
                </template>
                <!-- PDF iframe -->
                <template if:true={modalPdfPreviewUrl}>
                  <iframe
                    src={modalPdfPreviewUrl}
                    class="pm-pdf-iframe"
                    title="Document Preview"
                    frameborder="0"
                  ></iframe>
                </template>
              </div>
            </template>
          </div>
        </div>

        <!-- Footer -->
        <footer class="slds-modal__footer">
          <lightning-button
            label="Open in Salesforce"
            icon-name="utility:new_window"
            variant="neutral"
            onclick={handleOpenInSalesforce}
            class="slds-var-m-right_small"
          ></lightning-button>
          <lightning-button
            label="Close"
            variant="brand"
            onclick={handleCloseModal}
          ></lightning-button>
        </footer>
      </div>
    </section>
    <div class="slds-backdrop slds-backdrop_open"></div>
  </template>
</template>
