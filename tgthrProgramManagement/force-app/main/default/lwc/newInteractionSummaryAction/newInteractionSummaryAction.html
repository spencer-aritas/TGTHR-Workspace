<template>
    <div class="action-form">

        <div class="slds-grid slds-wrap slds-gutters_small">

            <!-- Date -->
            <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2 slds-m-bottom_small">
                <lightning-input
                    type="date"
                    label="Interaction Date"
                    value={interactionDate}
                    required
                    onchange={handleDateChange}>
                </lightning-input>
            </div>

            <!-- Time -->
            <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2 slds-m-bottom_small">
                <lightning-input
                    type="time"
                    label="Interaction Time"
                    value={interactionTime}
                    required
                    onchange={handleTimeChange}>
                </lightning-input>
            </div>

            <!-- Interaction Purpose -->
            <div class="slds-col slds-size_1-of-1 slds-m-bottom_small">
                <lightning-combobox
                    label="Interaction Purpose"
                    placeholder="Select purpose..."
                    value={purpose}
                    options={purposeOptions}
                    onchange={handlePurposeChange}>
                </lightning-combobox>
            </div>

            <!-- Meeting Notes -->
            <div class="slds-col slds-size_1-of-1 slds-m-bottom_small">
                <lightning-textarea
                    label="Meeting Notes"
                    value={notes}
                    max-length="10000"
                    placeholder="Enter interaction notes..."
                    onchange={handleNotesChange}>
                </lightning-textarea>
            </div>

            <!-- Notify Care Team -->
            <div class="slds-col slds-size_1-of-1 slds-m-bottom_small">
                <lightning-input
                    type="checkbox"
                    label="Notify Care Team"
                    checked={notifyCareTeam}
                    onchange={handleNotifyCareTeamChange}>
                </lightning-input>
            </div>

        </div>

        <template lwc:if={saveError}>
            <p class="slds-text-color_error slds-m-top_x-small slds-m-bottom_small">{saveError}</p>
        </template>

        <template lwc:if={saving}>
            <div class="slds-m-top_small slds-m-bottom_small">
                <lightning-spinner alternative-text="Saving..." size="small"></lightning-spinner>
                <span class="slds-m-left_small slds-text-body_small">Creating record and generating document…</span>
            </div>
        </template>

        <div class="action-footer slds-m-top_medium">
            <lightning-button
                variant="brand"
                label="Save"
                onclick={handleSubmit}
                disabled={saving}
                class="slds-m-right_small">
            </lightning-button>
            <lightning-button
                variant="neutral"
                label="Cancel"
                onclick={handleCancel}
                disabled={saving}>
            </lightning-button>
        </div>

    </div>
</template>
